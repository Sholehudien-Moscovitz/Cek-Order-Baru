<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Menu Cek Order - Internal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* Pembungkus agar kotak dan copyright tersusun rapi dari atas ke bawah di tengah */
        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 450px;
        }
        .container {
            text-align: center;
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            color: #ff6600;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }
        p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: block;
            background: linear-gradient(135deg, #fe5722, #ff6600);
            color: white;
            text-decoration: none;
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(255, 102, 0, 0.3);
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .btn-tiktok {
            background: linear-gradient(135deg, #010101, #25f4ee);
            color: #fff;
            box-shadow: 0 4px 10px rgba(37, 244, 238, 0.2);
        }
        /* Style untuk Copyright di bawah kotak persis */
        .footer-copyright {
            margin-top: 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 0.85rem;
            width: 100%;
        }
        .footer-copyright a {
            color: #00a2ff;
            text-decoration: none;
        }
        .footer-copyright a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Kotak Menu Utama -->
    <div class="container">
        <h1>Dashboar Sistem Cek Order</h1>
        <p>Silakan pilih platform yang ingin Anda cek:</p>
        
        <div class="btn-group">
            <a href="shopee.html" class="btn">❤️ Buka Cek Order Shopee</a>
            <a href="tiktok.html" class="btn btn-tiktok">💙 Buka Cek Order TikTok</a>
        </div>
    </div>

    <!-- Copyright di dalam wrapper, posisinya dijamin tepat di bawah kotak -->
    <div class="footer-copyright">
         Copyright &copy; 2026 . <span style="color: #00a2ff;">Sholehudien Moscovitz</span>.
    </div>
</div>

<script>
    let passwordBenar = "jtgUF6GyNPQp"; 
    let passwordUser = prompt("Masukkan Password Dulu Banggg:");
    
    if (passwordUser !== passwordBenar) {
        alert("Password salah!! wle kasian gak bisa masuk ckckck");
        document.body.innerHTML = "<h2 style='text-align:center; margin-top:100px; color:red;'>Akses Ditolak!! Gabisa masuk sini yee :p </h2>";
    }
</script>

</body>
</html>
